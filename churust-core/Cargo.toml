[package]
name = "churust-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Core engine, routing, pipeline, and extractors for the Churust web framework."

[package.metadata.docs.rs]
all-features = true

[dependencies]
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
http.workspace = true
bytes.workspace = true
futures-util.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_urlencoded.workspace = true
toml = "0.8"
rustls = { version = "0.23", optional = true }
tokio-rustls = { version = "0.26", optional = true }
rustls-pemfile = { version = "2", optional = true }
tokio-tungstenite = { version = "0.26", optional = true }

[dev-dependencies]
tokio-tungstenite = "0.26"

[features]
default = []
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile"]
ws = ["dep:tokio-tungstenite"]
# StaticFiles is the only thing that needs tokio's filesystem support, so it is
# pulled in here rather than enabled for every build.
fs = ["tokio/fs"]
