[package]
name = "churust-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Core engine, routing, pipeline, and extractors for the Churust web framework."

# Inherits `unsafe_code = "forbid"` from the workspace.
[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
http-body.workspace = true
http.workspace = true
bytes.workspace = true
futures-util.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_html_form.workspace = true
toml = "0.8"
# Connection-level diagnostics: accept failures, TLS handshake failures and
# timeouts. Costs nothing without a subscriber installed, and these are events
# an operator needs — a dropped TLS handshake is the most common "the server is
# up but I cannot connect", and printing to stderr per scanner probe is its own
# denial of service on the log pipeline.
tracing.workspace = true
hmac.workspace = true
sha2.workspace = true
# `ring`, with defaults off. rustls 0.23 defaults to aws-lc-rs, and quinn's
# QUIC crypto is ring-backed, so leaving both on makes rustls refuse to pick a
# provider at runtime rather than at compile time. One provider, chosen here.
rustls = { version = "0.23", optional = true, default-features = false, features = [
  "ring",
  "std",
  "tls12",
  "logging",
] }
# Defaults off for the same reason as rustls above: tokio-rustls defaults to
# aws_lc_rs, which would put a second crypto provider in the build.
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = [
  "ring",
  "tls12",
  "logging",
] }
rustls-pemfile = { version = "2", optional = true }
tokio-tungstenite = { version = "0.26", optional = true }
# IMF-fixdate parsing and formatting for Last-Modified / If-Modified-Since.
# Not a new tree entry: hyper already depends on httpdate, so this costs nothing
# beyond naming it. Hand-rolling HTTP date handling is a classic source of
# caching bugs.
httpdate = { version = "1", optional = true }
tower-service = { workspace = true, optional = true }
tower-layer = { workspace = true, optional = true }
quinn = { workspace = true, optional = true }
h3 = { workspace = true, optional = true }
h3-quinn = { workspace = true, optional = true }

[dev-dependencies]
tokio-tungstenite = "0.26"
# Self-signed certificates generated in-process, so the TLS serving path can be
# tested without checking key material into the repository.
rcgen = "0.13"
# A real HTTP/2 client for the connection-bound tests. hyper already depends on
# h2, so this names an existing tree entry rather than adding one.
h2 = "0.4"
# Hand-written layers in the tower-adapter tests, so those tests check the
# adapter rather than someone else's middleware.
tower-layer = "0.3"
tower-service = "0.3"
# The client half of the h3 stack, so the HTTP/3 tests speak real QUIC to the
# real listener rather than asserting on the pieces in isolation.
quinn = { workspace = true }
h3 = { workspace = true }
h3-quinn = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-util = { workspace = true }

[features]
default = []
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile"]
ws = ["dep:tokio-tungstenite"]
# StaticFiles is the only thing that needs tokio's filesystem support, so it is
# pulled in here rather than enabled for every build.
fs = ["tokio/fs", "dep:httpdate"]
# Run a `tower::Service` as Churust middleware, so the tower-http ecosystem
# (compression, tracing, request ids, header manipulation, ...) is reachable
# without reimplementing it here.
tower = ["dep:tower-service", "dep:tower-layer"]
# multipart/form-data parsing. No new dependency: the parser is hand-rolled
# over the already-buffered body.
multipart = []
# HTTP/3 over QUIC. Implies `tls`: QUIC has no plaintext mode, so there is no
# such thing as h3 without a certificate.
http3 = ["tls", "dep:quinn", "dep:h3", "dep:h3-quinn"]
