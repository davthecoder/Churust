[package]
name = "api"
version.workspace = true
edition.workspace = true
publish = false

# `workspace = true` builds this example against the copy of Churust in this
# repository. In your own project write the published version instead:
#
#     churust = { version = "0.2", features = ["full"] }
#     serde   = { version = "1", features = ["derive"] }
#
# `full` turns on the json, logging, cors, and auth plugins.
# Inherits `unsafe_code = "forbid"` from the workspace.
[lints]
workspace = true

[dependencies]
churust = { workspace = true, features = ["full"] }
serde = { workspace = true }
