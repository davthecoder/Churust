[package]
name = "chat"
version.workspace = true
edition.workspace = true
publish = false

# `workspace = true` builds this example against the copy of Churust in this
# repository. In your own project write the published version instead:
#
#     churust = { version = "0.2", features = ["ws"] }
#
# This example uses tokio's `broadcast` and `select!` and still needs no tokio
# dependency — it reaches them through `churust::tokio`.
[dependencies]
churust = { workspace = true, features = ["ws"] }
