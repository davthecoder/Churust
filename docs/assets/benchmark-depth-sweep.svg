<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="ds-t ds-d">
<title id="ds-t">Churust and actix-web throughput across HTTP/1.1 pipeline depths</title>
<desc id="ds-d">At depth 16 actix-web leads by 3 percent, at 64 Churust leads by 2 percent, at 128 and 256 actix-web leads by 13 percent.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
.s{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.mut{fill:#898781}.acc{fill:#2a78d6}.peer{fill:#898781}.s2{fill:#eb6834}.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.acc-s{stroke:#2a78d6}.s2-s{stroke:#eb6834}.ring{stroke:#fcfcfb}
@media (prefers-color-scheme:dark){.s{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.mut{fill:#898781}.acc{fill:#3987e5}.peer{fill:#898781}.s2{fill:#d95926}.grid{stroke:#2c2c2a}.axis{stroke:#383835}.acc-s{stroke:#3987e5}.s2-s{stroke:#d95926}.ring{stroke:#1a1a19}}
</style>
<rect class="s" width="900" height="430" rx="10"/>
<text class="ink" x="28" y="34" font-size="17" font-weight="600">The margin against actix-web changes hands with pipeline depth</text><text class="mut" x="28" y="55" font-size="12.5">Requests per second · Churust leads at depth 64 only · higher is better</text>
<line class="grid" x1="78" y1="322.0" x2="790" y2="322.0" stroke-width="1"/>
<text class="mut" x="66" y="326.0" font-size="10.5" text-anchor="end">0M</text>
<line class="grid" x1="78" y1="249.3" x2="790" y2="249.3" stroke-width="1"/>
<text class="mut" x="66" y="253.3" font-size="10.5" text-anchor="end">2M</text>
<line class="grid" x1="78" y1="176.7" x2="790" y2="176.7" stroke-width="1"/>
<text class="mut" x="66" y="180.7" font-size="10.5" text-anchor="end">4M</text>
<line class="grid" x1="78" y1="104.0" x2="790" y2="104.0" stroke-width="1"/>
<text class="mut" x="66" y="108.0" font-size="10.5" text-anchor="end">6M</text>
<text class="mut" x="78.0" y="344" font-size="11.5" text-anchor="middle">16</text>
<text class="mut" x="430.0" y="344" font-size="11.5" text-anchor="middle">64</text>
<text class="mut" x="606.0" y="344" font-size="11.5" text-anchor="middle">128</text>
<text class="mut" x="782.0" y="344" font-size="11.5" text-anchor="middle">256</text>
<text class="ink2" x="430.0" y="368" font-size="12" text-anchor="middle">pipeline depth (requests per batch)</text>
<line class="axis" x1="78" y1="322" x2="790" y2="322" stroke-width="1"/>
<polyline class="acc-s" points="78.0,293.9 430.0,209.9 606.0,157.6 782.0,139.2" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle class="ring" cx="78.0" cy="293.9" r="5.5" fill="none" stroke-width="3"/>
<circle class="acc" cx="78.0" cy="293.9" r="4.5"/>
<circle class="ring" cx="430.0" cy="209.9" r="5.5" fill="none" stroke-width="3"/>
<circle class="acc" cx="430.0" cy="209.9" r="4.5"/>
<circle class="ring" cx="606.0" cy="157.6" r="5.5" fill="none" stroke-width="3"/>
<circle class="acc" cx="606.0" cy="157.6" r="4.5"/>
<circle class="ring" cx="782.0" cy="139.2" r="5.5" fill="none" stroke-width="3"/>
<circle class="acc" cx="782.0" cy="139.2" r="4.5"/>
<polyline class="s2-s" points="78.0,293.1 430.0,212.4 606.0,136.1 782.0,115.7" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle class="ring" cx="78.0" cy="293.1" r="5.5" fill="none" stroke-width="3"/>
<circle class="s2" cx="78.0" cy="293.1" r="4.5"/>
<circle class="ring" cx="430.0" cy="212.4" r="5.5" fill="none" stroke-width="3"/>
<circle class="s2" cx="430.0" cy="212.4" r="4.5"/>
<circle class="ring" cx="606.0" cy="136.1" r="5.5" fill="none" stroke-width="3"/>
<circle class="s2" cx="606.0" cy="136.1" r="4.5"/>
<circle class="ring" cx="782.0" cy="115.7" r="5.5" fill="none" stroke-width="3"/>
<circle class="s2" cx="782.0" cy="115.7" r="4.5"/>
<text class="ink" x="796.0" y="143.2" font-size="12" font-weight="600">5.03M</text>
<text class="ink" x="796.0" y="119.7" font-size="12" font-weight="600">5.68M</text>
<circle class="acc" cx="618" cy="36" r="5"/>
<text class="ink2" x="632" y="40" font-size="12.5">Churust</text>
<circle class="s2" cx="714" cy="36" r="5"/>
<text class="ink2" x="728" y="40" font-size="12.5">actix-web</text>
<text class="mut" x="28" y="408" font-size="11">Published in full rather than at the one depth Churust wins. Method and caveats in benchmarks/results/.</text>
</svg>
