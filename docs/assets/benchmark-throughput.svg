<text class="mut" x="407.0" y="78" font-size="10.5" text-anchor="middle">400k</text>
<line class="grid" x1="526.5" y1="84" x2="526.5" y2="340" stroke-width="1"/>
<text class="mut" x="526.5" y="78" font-size="10.5" text-anchor="middle">600k</text>
<text class="ink2" x="154" y="108.5" font-size="13" font-weight="400" text-anchor="end">actix-web</text>
<path class="peer" d="M168,92 H696.0 A4,4 0 0 1 700.0,96 V112 A4,4 0 0 1 696.0,116 H168 Z"/>
<text class="ink2" x="710.0" y="108.5" font-size="13" font-weight="400">890k</text>
