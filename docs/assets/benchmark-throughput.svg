<text class="ink2" x="154" y="152.5" font-size="13" font-weight="400" text-anchor="end">actix-web</text>
<path class="peer" d="M168,136 H685.23927154927 A4,4 0 0 1 689.23927154927,140 V156 A4,4 0 0 1 685.23927154927,160 H168 Z"/>
<text class="ink2" x="699.2" y="152.5" font-size="13" font-weight="400">3.04M</text>
<text class="ink2" x="154" y="196.5" font-size="13" font-weight="400" text-anchor="end">Ktor (Netty)</text>
<path class="peer" d="M168,180 H398.3502034041911 A4,4 0 0 1 402.3502034041911,184 V200 A4,4 0 0 1 398.3502034041911,204 H168 Z"/>
<text class="ink2" x="412.4" y="196.5" font-size="13" font-weight="400">1.37M</text>
<text class="ink2" x="154" y="240.5" font-size="13" font-weight="400" text-anchor="end">axum</text>
<path class="peer" d="M168,224 H207.12061168918007 A4,4 0 0 1 211.12061168918007,228 V244 A4,4 0 0 1 207.12061168918007,248 H168 Z"/>
<text class="ink2" x="221.1" y="240.5" font-size="13" font-weight="400">251k</text>
<text class="ink2" x="154" y="284.5" font-size="13" font-weight="400" text-anchor="end">Go net/http</text>
