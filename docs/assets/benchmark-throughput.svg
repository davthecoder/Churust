<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 408" width="900" height="408" role="img" aria-labelledby="tp-t tp-d">
<title id="tp-t">Requests per second by framework, keep-alive, four workers each</title>
<desc id="tp-d">actix-web 890k, bare hyper 874k, Churust 798k, axum 455k, Go net/http 311k, Ktor 297k requests per second. Higher is better; actix-web leads and Churust is second of the frameworks.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
.s{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.mut{fill:#898781}.acc{fill:#2a78d6}.peer{fill:#898781}.s2{fill:#eb6834}.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.acc-s{stroke:#2a78d6}.s2-s{stroke:#eb6834}.ring{stroke:#fcfcfb}
@media (prefers-color-scheme:dark){.s{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.mut{fill:#898781}.acc{fill:#3987e5}.peer{fill:#898781}.s2{fill:#d95926}.grid{stroke:#2c2c2a}.axis{stroke:#383835}.acc-s{stroke:#3987e5}.s2-s{stroke:#d95926}.ring{stroke:#1a1a19}}
</style>
<rect class="s" width="900" height="408" rx="10"/>
<text class="ink" x="28" y="34" font-size="17" font-weight="600">Requests per second — keep-alive, four workers each</text><text class="mut" x="28" y="55" font-size="12.5">Linux 6.12, 8 pinned cores · 64 connections · median of 9 rounds · higher is better</text>
