<path class="peer" d="M168,224 H436.07441258688635 A4,4 0 0 1 440.07441258688635,228 V244 A4,4 0 0 1 436.07441258688635,248 H168 Z"/>
<text class="ink2" x="450.1" y="240.5" font-size="13" font-weight="400">455k</text>
<text class="ink2" x="154" y="284.5" font-size="13" font-weight="400" text-anchor="end">Go net/http</text>
