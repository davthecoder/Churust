<text class="ink2" x="700.0" y="152.5" font-size="13" font-weight="400">874k</text>
<text class="ink" x="154" y="196.5" font-size="13" font-weight="600" text-anchor="end">Churust</text>
<path class="acc" d="M168,180 H640.9093528993573 A4,4 0 0 1 644.9093528993573,184 V200 A4,4 0 0 1 640.9093528993573,204 H168 Z"/>
<text class="ink" x="654.9" y="196.5" font-size="13" font-weight="600">798k</text>
