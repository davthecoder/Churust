<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 408" width="900" height="408" role="img" aria-labelledby="cpu-t cpu-d">
<title id="cpu-t">Server CPU microseconds per request by framework</title>
<desc id="cpu-d">bare hyper 4.17, actix-web 4.24, Churust 4.92, axum 8.83, Go net/http 13.12, Ktor 20.47 microseconds of CPU per request. Lower is better. The gap from Churust to the bare-hyper floor, 0.75, is what the framework layer itself costs.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
.s{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.mut{fill:#898781}.acc{fill:#2a78d6}.peer{fill:#898781}.s2{fill:#eb6834}.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.acc-s{stroke:#2a78d6}.s2-s{stroke:#eb6834}.ring{stroke:#fcfcfb}
@media (prefers-color-scheme:dark){.s{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.mut{fill:#898781}.acc{fill:#3987e5}.peer{fill:#898781}.s2{fill:#d95926}.grid{stroke:#2c2c2a}.axis{stroke:#383835}.acc-s{stroke:#3987e5}.s2-s{stroke:#d95926}.ring{stroke:#1a1a19}}
</style>
<rect class="s" width="900" height="408" rx="10"/>
<text class="ink" x="28" y="34" font-size="17" font-weight="600">Server CPU per request — actix-web is the most efficient</text><text class="mut" x="28" y="55" font-size="12.5">Microseconds of process CPU per request served, keep-alive · lower is better</text>
<line class="grid" x1="297.9" y1="84" x2="297.9" y2="340" stroke-width="1"/>
<text class="mut" x="297.9" y="78" font-size="10.5" text-anchor="middle">5</text>
<line class="grid" x1="427.9" y1="84" x2="427.9" y2="340" stroke-width="1"/>
<text class="mut" x="427.9" y="78" font-size="10.5" text-anchor="middle">10</text>
<line class="grid" x1="557.8" y1="84" x2="557.8" y2="340" stroke-width="1"/>
<text class="mut" x="557.8" y="78" font-size="10.5" text-anchor="middle">15</text>
<line class="grid" x1="687.8" y1="84" x2="687.8" y2="340" stroke-width="1"/>
<text class="mut" x="687.8" y="78" font-size="10.5" text-anchor="middle">20</text>
<text class="ink2" x="154" y="108.5" font-size="13" font-weight="400" text-anchor="end">bare hyper (floor)</text>
<path class="peer" d="M168,92 H272.3751831949194 A4,4 0 0 1 276.3751831949194,96 V112 A4,4 0 0 1 272.3751831949194,116 H168 Z"/>
<text class="ink2" x="286.4" y="108.5" font-size="13" font-weight="400">4.17 µs</text>
<text class="ink2" x="154" y="152.5" font-size="13" font-weight="400" text-anchor="end">actix-web</text>
<path class="peer" d="M168,136 H274.1944308744504 A4,4 0 0 1 278.1944308744504,140 V156 A4,4 0 0 1 274.1944308744504,160 H168 Z"/>
<text class="ink2" x="288.2" y="152.5" font-size="13" font-weight="400">4.24 µs</text>
<text class="ink" x="154" y="196.5" font-size="13" font-weight="600" text-anchor="end">Churust</text>
<path class="acc" d="M168,180 H291.86712261846606 A4,4 0 0 1 295.86712261846606,184 V200 A4,4 0 0 1 291.86712261846606,204 H168 Z"/>
<text class="ink" x="305.9" y="196.5" font-size="13" font-weight="600">4.92 µs</text>
<text class="ink2" x="154" y="240.5" font-size="13" font-weight="400" text-anchor="end">axum</text>
<path class="peer" d="M168,224 H393.48510014655596 A4,4 0 0 1 397.48510014655596,228 V244 A4,4 0 0 1 393.48510014655596,248 H168 Z"/>
<text class="ink2" x="407.5" y="240.5" font-size="13" font-weight="400">8.83 µs</text>
<text class="ink2" x="154" y="284.5" font-size="13" font-weight="400" text-anchor="end">Go net/http</text>
<path class="peer" d="M168,268 H504.9789936492428 A4,4 0 0 1 508.9789936492428,272 V288 A4,4 0 0 1 504.9789936492428,292 H168 Z"/>
<text class="ink2" x="519.0" y="284.5" font-size="13" font-weight="400">13.12 µs</text>
<text class="ink2" x="154" y="328.5" font-size="13" font-weight="400" text-anchor="end">Ktor (Netty)</text>
<path class="peer" d="M168,312 H696.0 A4,4 0 0 1 700.0,316 V332 A4,4 0 0 1 696.0,336 H168 Z"/>
