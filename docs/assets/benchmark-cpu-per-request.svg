<line class="axis" x1="168" y1="84" x2="168" y2="340" stroke-width="1"/>
<text class="mut" x="28" y="386" font-size="11">Each server at its best worker count. actix-web does the same work for a third less CPU, which is the clearest gap in this comparison.</text>
</svg>
