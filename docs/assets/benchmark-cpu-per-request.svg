<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 364" width="900" height="364" role="img" aria-labelledby="cpu-t cpu-d">
<title id="cpu-t">Server CPU microseconds per request by framework</title>
<desc id="cpu-d">actix-web 7.44, Churust 8.37, axum 8.70, Go net/http 13.04, Ktor 19.95 microseconds of CPU per request. Lower is better; actix-web is best.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
.s{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.mut{fill:#898781}.acc{fill:#2a78d6}.peer{fill:#898781}.s2{fill:#eb6834}.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.acc-s{stroke:#2a78d6}.s2-s{stroke:#eb6834}.ring{stroke:#fcfcfb}
@media (prefers-color-scheme:dark){.s{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.mut{fill:#898781}.acc{fill:#3987e5}.peer{fill:#898781}.s2{fill:#d95926}.grid{stroke:#2c2c2a}.axis{stroke:#383835}.acc-s{stroke:#3987e5}.s2-s{stroke:#d95926}.ring{stroke:#1a1a19}}
</style>
<rect class="s" width="900" height="364" rx="10"/>
<text class="ink" x="28" y="34" font-size="17" font-weight="600">Server CPU per request — actix-web is the most efficient</text><text class="mut" x="28" y="55" font-size="12.5">Microseconds of process CPU per request served, keep-alive · lower is better</text>
<line class="grid" x1="301.3" y1="84" x2="301.3" y2="296" stroke-width="1"/>
<text class="mut" x="301.3" y="78" font-size="10.5" text-anchor="middle">5</text>
<line class="grid" x1="434.7" y1="84" x2="434.7" y2="296" stroke-width="1"/>
<text class="mut" x="434.7" y="78" font-size="10.5" text-anchor="middle">10</text>
<line class="grid" x1="568.0" y1="84" x2="568.0" y2="296" stroke-width="1"/>
<text class="mut" x="568.0" y="78" font-size="10.5" text-anchor="middle">15</text>
<line class="grid" x1="701.3" y1="84" x2="701.3" y2="296" stroke-width="1"/>
<text class="mut" x="701.3" y="78" font-size="10.5" text-anchor="middle">20</text>
<text class="ink2" x="154" y="108.5" font-size="13" font-weight="400" text-anchor="end">actix-web</text>
<path class="peer" d="M168,92 H362.40000000000003 A4,4 0 0 1 366.40000000000003,96 V112 A4,4 0 0 1 362.40000000000003,116 H168 Z"/>
<text class="ink2" x="376.4" y="108.5" font-size="13" font-weight="400">7.44 µs</text>
<text class="ink" x="154" y="152.5" font-size="13" font-weight="600" text-anchor="end">Churust</text>
<path class="acc" d="M168,136 H387.19999999999993 A4,4 0 0 1 391.19999999999993,140 V156 A4,4 0 0 1 387.19999999999993,160 H168 Z"/>
<text class="ink" x="401.2" y="152.5" font-size="13" font-weight="600">8.37 µs</text>
<text class="ink2" x="154" y="196.5" font-size="13" font-weight="400" text-anchor="end">axum</text>
<path class="peer" d="M168,180 H396.0 A4,4 0 0 1 400.0,184 V200 A4,4 0 0 1 396.0,204 H168 Z"/>
<text class="ink2" x="410.0" y="196.5" font-size="13" font-weight="400">8.7 µs</text>
<text class="ink2" x="154" y="240.5" font-size="13" font-weight="400" text-anchor="end">Go net/http</text>
<path class="peer" d="M168,224 H511.73333333333335 A4,4 0 0 1 515.7333333333333,228 V244 A4,4 0 0 1 511.73333333333335,248 H168 Z"/>
<text class="ink2" x="525.7" y="240.5" font-size="13" font-weight="400">13.04 µs</text>
<text class="ink2" x="154" y="284.5" font-size="13" font-weight="400" text-anchor="end">Ktor (Netty)</text>
<path class="peer" d="M168,268 H696.0 A4,4 0 0 1 700.0,272 V288 A4,4 0 0 1 696.0,292 H168 Z"/>
<text class="ink2" x="710.0" y="284.5" font-size="13" font-weight="400">19.95 µs</text>
<line class="axis" x1="168" y1="84" x2="168" y2="296" stroke-width="1"/>
<text class="mut" x="28" y="342" font-size="11">Churust buys its throughput with more CPU than actix-web spends. The figure does not depend on how fast the wire is.</text>
</svg>
