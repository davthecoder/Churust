<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 422" width="900" height="422" role="img" aria-labelledby="p99-t p99-d">
<title id="p99-t">Tail latency at the 99th percentile, keep-alive</title>
<desc id="p99-d">actix-web 0.171ms, bare hyper 0.175ms, Churust 0.211ms, axum 0.326ms, Ktor 1.84ms, Go net/http 2.46ms. Lower is better; actix-web leads.</desc>
