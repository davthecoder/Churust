<text class="mut" x="28" y="342" font-size="11">The cost of run_sharded: pinning a connection to one runtime means it waits for that</text>
<text class="mut" x="28" y="358" font-size="11">worker instead of being picked up by an idle one. The shared-runtime default is 444us.</text>
