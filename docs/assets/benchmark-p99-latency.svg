<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 378" width="900" height="378" role="img" aria-labelledby="p99-t p99-d">
<title id="p99-t">Tail latency at the 99th percentile, keep-alive</title>
<desc id="p99-d">axum 0.34ms, actix-web 0.41ms, Churust 1.12ms, Ktor 1.95ms, Go net/http 2.55ms. Lower is better; axum is best and Churust is third.</desc>
