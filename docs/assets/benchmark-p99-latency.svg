<text class="mut" x="28" y="342" font-size="11">Moves a lot between runs — actix-web measured 412us in one and 1.10ms in the next —</text>
<text class="mut" x="28" y="358" font-size="11">so read the ordering here as approximate. The shared-runtime default measures 444us.</text>
