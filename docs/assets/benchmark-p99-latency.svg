<text class="ink2" x="210.2" y="108.5" font-size="13" font-weight="400">0.553 ms</text>
<text class="ink2" x="154" y="152.5" font-size="13" font-weight="400" text-anchor="end">Ktor (Netty)</text>
<path class="peer" d="M168,136 H313.00656455142234 A4,4 0 0 1 317.00656455142234,140 V156 A4,4 0 0 1 313.00656455142234,160 H168 Z"/>
<text class="ink2" x="327.0" y="152.5" font-size="13" font-weight="400">2.56 ms</text>
<text class="ink" x="154" y="196.5" font-size="13" font-weight="600" text-anchor="end">Churust</text>
