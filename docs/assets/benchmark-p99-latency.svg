<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 378" width="900" height="378" role="img" aria-labelledby="p99-t p99-d">
<title id="p99-t">Tail latency at the 99th percentile, keep-alive</title>
<desc id="p99-d">axum 0.33ms, Churust 0.60ms, actix-web 1.10ms, Ktor 1.88ms, Go net/http 2.46ms. Lower is better; axum is best and Churust is second. This measure is the noisiest one here and moves between runs.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
.s{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.mut{fill:#898781}.acc{fill:#2a78d6}.peer{fill:#898781}.s2{fill:#eb6834}.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.acc-s{stroke:#2a78d6}.s2-s{stroke:#eb6834}.ring{stroke:#fcfcfb}
@media (prefers-color-scheme:dark){.s{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.mut{fill:#898781}.acc{fill:#3987e5}.peer{fill:#898781}.s2{fill:#d95926}.grid{stroke:#2c2c2a}.axis{stroke:#383835}.acc-s{stroke:#3987e5}.s2-s{stroke:#d95926}.ring{stroke:#1a1a19}}
</style>
<rect class="s" width="900" height="378" rx="10"/>
<text class="ink" x="28" y="34" font-size="17" font-weight="600">Tail latency — the noisiest measure here</text><text class="mut" x="28" y="55" font-size="12.5">99th-percentile response time under keep-alive load · lower is better</text>
