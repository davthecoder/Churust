<text class="mut" x="400.8" y="78" font-size="10.5" text-anchor="middle">4ms</text>
<line class="grid" x1="517.2" y1="84" x2="517.2" y2="296" stroke-width="1"/>
<text class="mut" x="517.2" y="78" font-size="10.5" text-anchor="middle">6ms</text>
<line class="grid" x1="633.6" y1="84" x2="633.6" y2="296" stroke-width="1"/>
<text class="mut" x="633.6" y="78" font-size="10.5" text-anchor="middle">8ms</text>
<text class="ink2" x="154" y="108.5" font-size="13" font-weight="400" text-anchor="end">actix-web</text>
