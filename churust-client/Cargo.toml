[package]
name = "churust-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "HTTP client for the Churust web framework: pooled connections, JSON helpers, optional rustls."

[package.metadata.docs.rs]
all-features = true

[dependencies]
bytes = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
serde = { workspace = true }
serde_html_form = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
hyper-rustls = { workspace = true, optional = true }

[features]
default = []
# HTTPS through rustls, with the platform's own root store.
tls = ["dep:hyper-rustls"]

[dev-dependencies]
churust-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
