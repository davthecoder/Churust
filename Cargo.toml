[workspace]
resolver = "2"
members = ["churust-core", "churust-macros", "churust", "examples/hello", "churust-json", "churust-logging", "churust-cors", "churust-auth", "churust-ratelimit", "churust-compression", "churust-templates", "churust-redis", "churust-client", "churust-openapi", "churust-lab", "examples/api", "examples/chat", "examples/static"]

[workspace.package]
# Every Churust crate releases in lockstep on this single version.
# Bump via `cargo release <level>` — never edit the crate manifests by hand.
version = "0.3.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
authors = ["David Cruz Anaya <david.cruz@davthecoder.com>"]
keywords = ["web", "framework", "http", "ktor", "async"]
categories = ["web-programming::http-server", "asynchronous", "network-programming"]
repository = "https://github.com/davthecoder/Churust"
homepage = "https://github.com/davthecoder/Churust"
readme = "README.md"

[workspace.dependencies]
# Internal crates. `version` is what gets published; `path` is what builds
# locally. cargo-release rewrites these in step with workspace.package.version.
churust = { path = "churust", version = "0.3.0" }
churust-core = { path = "churust-core", version = "0.3.0" }
churust-macros = { path = "churust-macros", version = "0.3.0" }
churust-json = { path = "churust-json", version = "0.3.0" }
churust-logging = { path = "churust-logging", version = "0.3.0" }
churust-cors = { path = "churust-cors", version = "0.3.0" }
churust-auth = { path = "churust-auth", version = "0.3.0" }
churust-ratelimit = { path = "churust-ratelimit", version = "0.3.0" }
churust-compression = { path = "churust-compression", version = "0.3.0" }
churust-templates = { path = "churust-templates", version = "0.3.0" }
churust-redis = { path = "churust-redis", version = "0.3.0" }
churust-client = { path = "churust-client", version = "0.3.0" }
churust-openapi = { path = "churust-openapi", version = "0.3.0" }
# Shares the workspace version despite never promising 1.0 — see the crate docs
# for why, and for when that must be revisited.
churust-lab = { path = "churust-lab", version = "0.3.0" }

# Only the features Churust actually uses, audited against every `tokio::` path
# in the workspace: rt-multi-thread (the `main` macro, `Runtime`), net
# (`TcpListener`), io-util (`AsyncReadExt`), time (request timeouts), sync (the
# shutdown `oneshot`), signal (`ctrl_c`), macros (`select!`). `fs` is pulled in
# by churust-core's own `fs` feature rather than always.
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "time",
  "sync",
  "signal",
  "macros",
] }
# 1.11 is a floor, not a preference. Below it, hyper deletes a request's
# `Content-Length` when it parses a `Transfer-Encoding` first and does *not*
# close the connection — so an ambiguous message is served, and a smuggled
# request behind a Content-Length-believing proxy is answered. No header-map
# check in Churust can see that, because the evidence is gone before the engine
# is handed the request. 1.11 refuses both orderings itself. Churust is a
# library, so a dependent resolves its own hyper: the floor is the only thing
# that protects them, not our lockfile.
hyper = { version = "1.11", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = [
  "tokio",
  "server",
  "server-auto",
  "server-graceful",
  # The pooling client behind churust-client. Same crate as the server side, so
  # this adds code to that build rather than a new dependency to the tree.
  "client",
  "client-legacy",
] }
http-body-util = "0.1"
# The `http_body::Body` trait itself, so Churust's `Body` can implement it and
# be handed to anything written against the http/http-body crates.
http-body = "1"
# A tower `Service`/`Layer` boundary, feature-gated. Only the two trait crates:
# `tower` itself brings a large middleware tree Churust does not need, and the
# traits are what the ecosystem is actually written against.
tower-service = "0.3"
tower-layer = "0.3"
http = "1"
bytes = "1"
futures-util = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
# Query and form parsing. `serde_urlencoded` maps each key exactly once, so a
# `Vec<T>` field is unrepresentable — which breaks checkbox groups and
# `<select multiple>`, the ordinary HTML for a multi-value control.
# `serde_html_form` is the same surface with repeated keys supported.
serde_html_form = "0.2"
serde_json = "1"
tracing = "0.1"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
base64 = "0.22"
# Real MAC for signed session cookies. Both are RustCrypto, pure Rust, no_std
# capable and pull nothing heavy — worth it to make a session a trust boundary
# rather than a documented weakness.
hmac = "0.12"
sha2 = "0.10"
# Response compression. `async-compression` wraps the gzip/deflate/brotli
# encoders in an `AsyncRead`, which is what lets a streamed body stay streamed
# while being compressed instead of being collected first.
# `zlib`, not `deflate`: RFC 9110 §8.4.1.2 defines the `deflate` content coding
# as the zlib format of RFC 1950, and async-compression's `DeflateEncoder`
# emits raw RFC 1951 instead, which several clients reject.
async-compression = { version = "0.4", features = ["tokio", "gzip", "zlib", "brotli"] }
# Synchronous gzip/zlib inflate for the outbound client: the body is already
# buffered (see `max_response_bytes`), so an async decoder would only add
# ceremony. Same RFC 1950 deflate shape as the response compression plugin.
flate2 = "1"
# Bridges a `Stream` of chunks and an `AsyncRead`, in both directions. Only the
# `io` feature; the rest of tokio-util is not used.
tokio-util = { version = "0.7", features = ["io"] }
# Template rendering. Jinja2 syntax, one crate, no build script, and it does
# not pull a second async runtime the way the larger engines do.
minijinja = "2"
# Redis-backed session storage. Default features off: the crate otherwise
# brings a synchronous connection stack Churust never uses.
# Default features off: the crate otherwise brings a synchronous connection
# stack Churust never uses. `connection-manager` is deliberately not enabled --
# as of redis 1.4.1 it requires an arc-swap version that is not published, and
# the reconnect it provides is a few lines to do over a multiplexed connection.
redis = { version = "1", default-features = false, features = ["tokio-comp"] }
# rustls for the client side, sharing the TLS stack the server already uses.
# `ring` rather than aws-lc-rs: it is what churust-core's server TLS pulls, and
# two providers in one binary is a runtime error waiting to happen.
hyper-rustls = { version = "0.27", default-features = false, features = [
  "http1",
  "http2",
  "ring",
  "tls12",
  "webpki-tokio",
] }
# HTTP/3. quinn is the QUIC transport, h3 the protocol, h3-quinn the glue.
# Default features off on quinn so it takes the same ring-backed rustls the
# server TLS already uses rather than pulling a second crypto provider.
quinn = { version = "0.11", default-features = false, features = [
  "runtime-tokio",
  "rustls-ring",
] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
# OS entropy for session identifiers. Chosen over `rand` because a session
# id needs the operating system CSPRNG and nothing else that crate offers.
getrandom = "0.4"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
