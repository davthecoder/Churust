[workspace]
resolver = "2"
members = ["churust-core", "churust-macros", "churust", "examples/hello", "churust-json", "churust-logging", "churust-cors", "churust-auth", "examples/api", "examples/chat"]

[workspace.package]
edition = "2021"
rust-version = "1.96"
license = "MIT"
authors = ["David Cruz Anaya <cruzanayadavid@gmail.com>"]
keywords = ["web", "framework", "http", "ktor", "async"]
categories = ["web-programming::http-server", "asynchronous", "network-programming"]
# repository = "https://github.com/<you>/churust"  # set before publishing

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "server-graceful"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
futures-util = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_urlencoded = "0.7"
serde_json = "1"
tracing = "0.1"
jsonwebtoken = "9"
base64 = "0.22"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
