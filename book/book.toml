[book]
title = "Churust Documentation"
description = "Guides and reference for Churust — a Ktor-inspired Rust web framework (Churro + Rust)."
authors = ["David Cruz Anaya"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/davthecoder/Churust"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/davthecoder/Churust/edit/main/book/{path}"
site-url = "/Churust/"
cname = ""
additional-css = ["theme/churust.css"]
no-section-label = true

[output.html.fold]
enable = true
level = 1

[output.html.playground]
editable = false
copyable = true
line-numbers = false

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
