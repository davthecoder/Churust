[package]
name = "churust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Churust — a Ktor-inspired, secure, easy-to-learn Rust web framework (Churro + Rust)."

# Inherits `unsafe_code = "forbid"` from the workspace.
[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
churust-core = { workspace = true }
churust-macros = { workspace = true }
http = { workspace = true }
tokio = { workspace = true }
churust-json = { workspace = true, optional = true }
churust-logging = { workspace = true, optional = true }
churust-cors = { workspace = true, optional = true }
churust-auth = { workspace = true, optional = true }
churust-ratelimit = { workspace = true, optional = true }
churust-compression = { workspace = true, optional = true }
churust-templates = { workspace = true, optional = true }
churust-redis = { workspace = true, optional = true }
churust-client = { workspace = true, optional = true }
churust-openapi = { workspace = true, optional = true }

[features]
default = []
json = ["dep:churust-json"]
logging = ["dep:churust-logging"]
cors = ["dep:churust-cors"]
auth = ["dep:churust-auth"]
ratelimit = ["dep:churust-ratelimit"]
compression = ["dep:churust-compression"]
templates = ["dep:churust-templates"]
redis = ["dep:churust-redis"]
client = ["dep:churust-client"]
client-tls = ["client", "churust-client/tls"]
# The document is emitted as JSON, so the JSON plugin comes with it.
openapi = ["dep:churust-openapi", "json"]
tls = ["churust-core/tls"]
ws = ["churust-core/ws"]
fs = ["churust-core/fs"]
multipart = ["churust-core/multipart"]
http3 = ["churust-core/http3"]
# The plugin set. Transports (ws, fs, tls) stay opt-in individually, since each
# one is a protocol surface rather than an ergonomic addition.
full = ["json", "logging", "cors", "auth", "ratelimit", "compression", "templates"]
