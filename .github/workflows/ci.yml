name: CI

on:
  push:
    # Feature branches are covered directly, so work is verified as it lands
    # rather than only once a pull request exists.
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (workspace, default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (umbrella, all plugins)
        run: cargo clippy -p churust --all-targets --features full -- -D warnings

      - name: Clippy (core, TLS feature)
        run: cargo clippy -p churust-core --all-targets --features tls -- -D warnings

      - name: Test (workspace)
        run: cargo test --workspace

      - name: Test (umbrella, all plugins)
        run: cargo test -p churust --features full

      - name: Test (core, TLS feature)
        run: cargo test -p churust-core --features tls

      - name: Build examples
        run: cargo build -p hello -p api

      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
