name: Release

# Fired by the tag that `cargo release` pushes. Nothing else publishes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # mint the short-lived crates.io token via OIDC

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # A tag that disagrees with the manifests would publish the wrong version
      # under the right name, and crates.io versions cannot be taken back.
      - name: Verify tag matches workspace version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "churust") | .version')
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match workspace version $manifest"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      # Same gates as CI. A release must never be weaker than a pull request.
      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (workspace, default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (umbrella, all plugins)
        run: cargo clippy -p churust --all-targets --features full -- -D warnings

      - name: Test (workspace)
        run: cargo test --workspace

      - name: Test (umbrella, all plugins)
        run: cargo test -p churust --features full

      - name: Test (core, TLS feature)
        run: cargo test -p churust-core --features tls

      # Packages and verifies all seven crates without uploading, catching a
      # broken manifest before anything becomes permanent. `cargo package` is
      # used rather than `publish --dry-run` because the latter errors on any
      # version already on the registry, which would break re-runs.
      - name: Package check
        run: cargo package --workspace

      # Trusted Publishing: crates.io trades this job's OIDC identity for a
      # token that lives minutes. No registry secret is stored in GitHub.
      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Published one crate at a time, in dependency order, skipping anything
      # already on the registry.
      #
      # `cargo publish --workspace` aborts on the first crate that already
      # exists, which makes a half-finished release unrecoverable — and the
      # 0.1.0 release did stall halfway, on the new-crate rate limit. Skipping
      # what is already up means re-running this workflow finishes the job
      # instead of failing on work that succeeded last time.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          published=0
          skipped=0
          for crate in churust-core churust-macros \
                       churust-json churust-logging churust-cors churust-auth \
                       churust; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: churust-release-workflow' \
              "https://crates.io/api/v1/crates/$crate/$VERSION")
            if [ "$code" = "200" ]; then
              echo "skip     $crate $VERSION (already on crates.io)"
              skipped=$((skipped + 1))
              continue
            fi
            echo "publish  $crate $VERSION"
            cargo publish -p "$crate"
            published=$((published + 1))
          done
          echo "::notice::published $published crate(s), skipped $skipped already on crates.io"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "Churust $GITHUB_REF_NAME"
