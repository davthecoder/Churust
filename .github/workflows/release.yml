name: Release

# Fired by the tag that `cargo release` pushes. Nothing else publishes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # mint the short-lived crates.io token via OIDC

# Must match ci.yml, or a release could ship code a pull request would reject.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # A tag that disagrees with the manifests would publish the wrong version
      # under the right name, and crates.io versions cannot be taken back.
      - name: Verify tag matches workspace version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "churust") | .version')
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match workspace version $manifest"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      # Same gates as CI. A release must never be weaker than a pull request.
      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (workspace, default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (umbrella, all plugins)
        run: cargo clippy -p churust --all-targets --features full -- -D warnings

      - name: Clippy (core, TLS feature)
        run: cargo clippy -p churust-core --all-targets --features tls -- -D warnings

      - name: Test (workspace)
        run: cargo test --workspace

      - name: Test (umbrella, all plugins)
        run: cargo test -p churust --features full

      - name: Test (core, TLS feature)
        run: cargo test -p churust-core --features tls

      - name: Build examples
        run: cargo build -p hello -p api

      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      # Packages and verifies the seven publishable crates without uploading,
      # catching a broken manifest before anything becomes permanent.
      #
      # `cargo package` rather than `publish --dry-run`, because the latter
      # errors on any version already on the registry and would break re-runs.
      #
      # The examples are excluded deliberately. They are publish = false, so
      # packaging them proves nothing — and verification would strip their path
      # dependency on churust and resolve it from crates.io instead, meaning a
      # release that changes churust's API fails here against the *previous*
      # published version. Exactly that happened when the examples stopped
      # carrying their own tokio dependency.
      - name: Package check
        run: |
          cargo package --workspace \
            --exclude hello --exclude api --exclude chat --exclude static-example

      # Work out what is actually missing from the registry before touching
      # credentials. A re-run of an already-complete release then needs no
      # token at all and stays green.
      - name: Plan what to publish
        id: plan
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          pending=""
          for crate in churust-core churust-macros \
                       churust-json churust-logging churust-cors churust-auth \
                       churust; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: churust-release-workflow' \
              "https://crates.io/api/v1/crates/$crate/$VERSION")
            if [ "$code" = "200" ]; then
              echo "have    $crate $VERSION"
            else
              echo "pending $crate $VERSION"
              pending="$pending $crate"
            fi
          done
          echo "pending=${pending# }" >> "$GITHUB_OUTPUT"
          if [ -z "$pending" ]; then
            echo "::notice::all crates already on crates.io at $VERSION; nothing to publish"
          fi

      # Trusted Publishing: crates.io trades this job's OIDC identity for a
      # token that lives minutes. No registry secret is stored in GitHub.
      - name: Authenticate to crates.io
        if: steps.plan.outputs.pending != ''
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Published one crate at a time, in dependency order.
      #
      # `cargo publish --workspace` aborts on the first crate that already
      # exists, which makes a half-finished release unrecoverable — and the
      # 0.1.0 release did stall halfway, on the new-crate rate limit. Driving
      # the list from the plan step means re-running this workflow finishes the
      # job instead of failing on work that succeeded last time.
      - name: Publish
        if: steps.plan.outputs.pending != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PENDING: ${{ steps.plan.outputs.pending }}
        run: |
          set -euo pipefail
          published=0
          for crate in $PENDING; do
            echo "publish  $crate"
            cargo publish -p "$crate"
            published=$((published + 1))
          done
          echo "::notice::published $published crate(s)"

      # Also idempotent, so a re-run of a finished release does not fail here
      # after having correctly skipped the publishing.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME already exists"
            exit 0
          fi

          # The hand-written section for this version, if CHANGELOG.md has one.
          # Everything between this version's heading and the next one.
          changelog=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { grab = 1; next }
            grab && /^## \[/       { exit }
            grab                   { print }
          ' CHANGELOG.md 2>/dev/null || true)

          # GitHub's own commit/PR summary, which carries the compare link.
          auto=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq '.body' 2>/dev/null || true)

          {
            echo "All seven Churust crates release together on \`$VERSION\`."
            echo
            echo '```toml'
            echo '[dependencies]'
            echo "churust = \"$VERSION\""
            echo '```'
            echo

            if [ -n "$(printf '%s' "$changelog" | tr -d '[:space:]')" ]; then
              printf '%s\n\n' "$changelog"
            fi

            echo '### Crates'
            echo
            for c in churust churust-core churust-macros churust-json \
                     churust-logging churust-cors churust-auth; do
              echo "- [\`$c\`](https://crates.io/crates/$c/$VERSION) · [docs](https://docs.rs/$c/$VERSION)"
            done
            echo

            if [ -n "$(printf '%s' "$auto" | tr -d '[:space:]')" ]; then
              printf '%s\n' "$auto"
            fi
          } > "$RUNNER_TEMP/notes.md"

          # --latest is what puts the "Latest" badge on the release; --verify-tag
          # refuses to invent a tag that is not already pushed.
          gh release create "$GITHUB_REF_NAME" \
            --title "Churust $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest \
            --verify-tag
