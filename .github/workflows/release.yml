name: Release

# Fired by the tag that `cargo release` pushes. Nothing else publishes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # mint the short-lived crates.io token via OIDC

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # A tag that disagrees with the manifests would publish the wrong version
      # under the right name, and crates.io versions cannot be taken back.
      - name: Verify tag matches workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "churust") | .version')
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match workspace version $manifest"
            exit 1
          fi

      # Same gates as CI. A release must never be weaker than a pull request.
      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (workspace, default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (umbrella, all plugins)
        run: cargo clippy -p churust --all-targets --features full -- -D warnings

      - name: Test (workspace)
        run: cargo test --workspace

      - name: Test (umbrella, all plugins)
        run: cargo test -p churust --features full

      - name: Test (core, TLS feature)
        run: cargo test -p churust-core --features tls

      # Packages and verifies all seven crates without uploading. Catches a
      # broken manifest before anything becomes permanent.
      - name: Dry-run publish
        run: cargo publish --workspace --dry-run

      # Trusted Publishing: crates.io trades this job's OIDC identity for a
      # token that lives minutes. No registry secret is stored in GitHub.
      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # --workspace resolves the dependency order itself (core and macros
      # first, then the four plugins, then the churust umbrella) and skips
      # every publish = false example.
      - name: Publish
        run: cargo publish --workspace --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "Churust $GITHUB_REF_NAME"
