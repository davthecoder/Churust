# Drives the "Sponsor" button on the repository.
#
# davthecodercom is the personal account; davthecoder is the organization that
# owns this repo. Organizations need separate GitHub Sponsors onboarding, so the
# personal account is listed here.
#
# GitHub renders nothing at all until the listed account has an approved
# Sponsors listing (https://github.com/sponsors). Until then the repo sidebar
# shows an empty Sponsor section — that is enrollment pending, not a broken
# config. A `custom:` URL or one of the third-party platforms below works
# immediately and needs no approval.

github: [davthecodercom]

# github: [davthecodercom, davthecoder]   # once the org is onboarded too
# ko_fi: davthecoder
# buy_me_a_coffee: davthecoder
# liberapay: davthecoder
# open_collective: churust
# thanks_dev: davthecoder
# polar: davthecoder
# custom: ["https://davthecoder.com/sponsor"]
