title: "[idea] "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Churust keeps a narrow scope on purpose — it owns the ergonomic layer
        and leaves HTTP parsing, TLS, and scheduling to hyper, rustls, and
        tokio. Proposals are judged on whether they belong *here*.

        Already deferred as YAGNI: sessions, response compression, HTTP/3, and
        route-scoped middleware sugar. Making the case for one of those is fair
        game — just start from why the deferral was wrong.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What can't you do today, or what is awkward? Describe the situation, not
        the solution — a good problem statement often gets a better answer than
        the one you had in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: The API or behaviour you're imagining. Sketch code if you have it.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What you do instead today
      description: >
        Is this impossible, or just inconvenient? Both are valid answers and
        they lead to different decisions.
    validations:
      required: true

  - type: dropdown
    id: placement
    attributes:
      label: Where would this live
      options:
        - churust-core
        - A new or existing plugin crate
        - The umbrella churust crate
        - Not sure
    validations:
      required: true

  - type: textarea
    id: prior-art
    attributes:
      label: Prior art
      description: >
        How do Ktor, axum, actix-web, or others handle this? Worth saying what
        you like and dislike about their approach.
