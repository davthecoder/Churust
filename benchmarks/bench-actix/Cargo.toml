[package]
name = "bench-actix"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
actix-web = { version = "4.14", default-features = false, features = ["macros"] }

# Same profile as every other Rust app in the comparison. A benchmark where one
# side is built with LTO and the other is not measures the build, not the code.
[profile.release]
lto = true
codegen-units = 1
